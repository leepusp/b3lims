{% load static %}
<div class="border rounded bg-white p-3 mb-3" id="taxFill"
     data-search-url="{% url 'sample_organism_search' %}"
     data-type="{{ fill_type|default:'' }}"
     data-details-url="{% url 'sample_organism_details' %}"
     data-type-input="{{ fill_type_input|default:'' }}">
    <label class="form-label fw-semibold small mb-1" for="taxFillQuery">
        <i class="bi bi-search me-1 text-primary"></i>Fill from the local taxonomy
    </label>
    <div class="d-flex gap-2 align-items-center mb-2">
        <label class="small text-muted mb-0" for="taxFillSource">Search in</label>
        <select id="taxFillSource" class="form-select form-select-sm w-auto">
            <option value="all">All databases</option>
            <option value="ncbi">NCBI Taxonomy only</option>
            <option value="gtdb" hidden>GTDB only (bacteria)</option>
        </select>
    </div>
    <div class="position-relative">
        <input type="search" id="taxFillQuery" class="form-control form-control-sm" autocomplete="off"
               placeholder="Scientific or common name">
        <div id="taxFillResults" class="list-group position-absolute w-100 shadow-sm" hidden
             style="z-index: 30; max-height: 16rem; overflow: auto;"></div>
    </div>
    <div id="taxFillCard" class="mt-2" hidden></div>
    <input type="hidden" name="reference_json" id="referenceJson" value="[]">
    <div class="form-text" id="taxFillCount"></div>
    <div class="form-text" id="taxFillNote">Picking a result fills the fields below and sets the main organism. Every field stays editable, so you can also type them by hand.</div>
</div>
<script src="{% static 'internal/samples/sample_taxonomy_fill.js' %}?v=20261111-fill5"></script>
